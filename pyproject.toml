[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zotkit"
version = "0.8.0"
description = "Let AI agents manage your Zotero library: headless CLI + Python API to search, import, enrich, export BibTeX, and attach PDFs (Web API + WebDAV) — no desktop app required"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Shawn" }]
keywords = ["zotero", "reference-manager", "webdav", "bibliography", "cli", "headless", "ai-agents", "bibtex"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
]
dependencies = ["pyzotero", "httpx"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/oldantique/zotkit"
Issues = "https://github.com/oldantique/zotkit/issues"

[project.scripts]
zotkit = "zotkit.cli:main"

[tool.setuptools]
packages = ["zotkit"]
